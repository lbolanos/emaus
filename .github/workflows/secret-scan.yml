name: Secret Scan

# Backstop de secretos, deliberadamente en su propio workflow y SIN filtro de ramas.
#
# Por qué no vive en ci.yml: ese workflow excluye `master` del trigger de push ("Deploy
# workflow handles it"), pero deploy-production.yml NO lo invoca — duplica lint/test/build
# por su cuenta. Resultado: un job de secretos dentro de ci.yml nunca correría en los pushes
# directos a master, que es justo el flujo habitual del repo. Acá corre en todo push y todo PR.
#
# El pre-commit local (.husky/pre-commit) corre el mismo gitleaks con la misma config, pero es
# best-effort: se salta con --no-verify y no aplica a quien no lo tenga instalado. Este no.
# Falsos positivos → .gitleaks.toml, nunca deshabilitar el workflow.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para escanear el rango de commits del PR

      # IMPORTANTE: este job NO debe instalar dependencias. `gitleaks dir` no respeta
      # .gitignore, así que un `pnpm install` acá arrastraría node_modules (~1.2 GB) al
      # escaneo y lo llenaría de falsos positivos de terceros (medido: 35).
      - name: Install gitleaks (versión pinneada + checksum verificado)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      # 1) Estado actual del repo: atrapa cualquier secreto que viva en los archivos.
      #    Los dos incidentes reales del proyecto (Z.AI ~3 meses, AWS key ID ~2,8 meses)
      #    eran de este tipo y este escaneo los habría bloqueado en el primer push.
      - name: Escanear el árbol de trabajo
        run: gitleaks dir . --no-banner --redact -c .gitleaks.toml

      # 2) Cierra el hueco de (1): un secreto añadido y borrado dentro del mismo PR deja
      #    el árbol limpio pero sobrevive en el historial si el merge no es squash.
      - name: Escanear el rango de commits del PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gitleaks git --no-banner --redact -c .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Resumen
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Sin secretos detectados." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🔒 Posible secreto detectado" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Si es real: **rotar la key** (el repo es público, el historial la retiene) y sacarla del código vía variable de entorno." >> $GITHUB_STEP_SUMMARY
            echo "2. Si es un falso positivo: agregar el valor a \`.gitleaks.toml\`." >> $GITHUB_STEP_SUMMARY
            echo "3. Protocolo completo: skill \`secrets-management\`." >> $GITHUB_STEP_SUMMARY
          fi
