name: CI

on:
  push:
    branches: [main, develop]  # Skip master - Deploy workflow handles it
  pull_request:
    branches: [master, main, develop]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  # El escaneo de secretos vive en su propio workflow (.github/workflows/secret-scan.yml):
  # acá quedaría excluido de los pushes directos a master, que es el flujo habitual del repo.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    # The jest MAIN process keeps every suite's results in memory until the
    # final summary: with the full suite its heap passes 3.5GB and dies with
    # exit 134 (OOM) on Node 20/Linux — maxWorkers/workerIdleMemoryLimit do
    # not help because the main is not a worker. Each shard runs in a fresh
    # main with half the suites (~1.7GB peak, verified locally).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests (shard ${{ matrix.shard }}/2)
        run: pnpm --filter api test -- --shard=${{ matrix.shard }}/2

      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api
          name: api-coverage
          fail_ci_if_error: false

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @repo/ui package
        run: pnpm --filter @repo/ui build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run web tests
        run: pnpm test:web

      - name: Upload web coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/web/coverage/lcov.info
          flags: web
          name: web-coverage
          fail_ci_if_error: false

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No bloqueante a propósito: hay deuda preexistente de vulnerabilidades
      # transitivas (tiptap, nodemailer, js-yaml de eslint/ruler, etc.) que no
      # se resuelve en este cambio. El objetivo es visibilidad — que una
      # vulnerabilidad NUEVA aparezca en el summary de cada PR — no bloquear
      # el pipeline hasta que se audite y actualice esa deuda a propósito.
      - name: Run pnpm audit (informational)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test-api, test-web, build, audit]
    if: always()
    steps:
      - name: Generate CI Summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test API | ${{ needs.test-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Web | ${{ needs.test-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit (informativo) | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
