<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>__HEADLINE_TEXT__</title>
<style>
  :root {
    --deep: #16233F;   /* fondo profundo    */
    --blue: #1F3055;   /* azul de la comunidad */
    --gold: #D4A512;   /* dorado de los acentos */
    --sand: #F0D48A;   /* dorado claro del kicker */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: __W__px; height: __H__px;
    overflow: hidden;
    background: var(--deep);
    font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* La propia foto, ampliada y difuminada, rellena el lienzo vertical.
     Es lo que permite montar una foto horizontal sin recortar a nadie. */
  .backdrop {
    position: absolute; inset: -80px;
    background-image: url("__PHOTO__");
    background-size: cover;
    background-position: center 42%;
    filter: blur(52px) saturate(1.3) brightness(0.74);
    transform: scale(1.12);
  }
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(115% 74% at 50% 36%, rgba(31,48,85,0.12) 0%, rgba(22,35,63,0.74) 74%),
      linear-gradient(180deg, rgba(22,35,63,0.82) 0%, rgba(22,35,63,0.16) 40%, rgba(22,35,63,0.86) 100%);
  }

  .block { display: flex; flex-direction: column; align-items: center; }
  .stage {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: __PAD__px 0 __PADBOT__px;
    text-align: center;
  }

  .emblem { width: __EMBLEM__px; height: auto; margin-bottom: __EMBLEMGAP__px;
            filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55)); }

  .kicker {
    font-family: "Avenir Next Condensed", "Avenir Next", sans-serif;
    font-weight: 600;
    font-size: __KICKER__px;
    letter-spacing: __KICKTRACK__px;
    color: var(--sand);
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .headline {
    font-family: "Avenir Next Condensed", "Avenir Next", sans-serif;
    font-weight: 700;
    font-size: __HEAD__px;
    line-height: 1.02;
    letter-spacing: __HEADTRACK__px;
    color: #fff;
    text-transform: uppercase;
    margin-top: __HEADGAP__px;
    text-shadow: 0 4px 26px rgba(0,0,0,0.55);
  }

  .rule {
    display: flex; align-items: center; justify-content: center;
    gap: __RULEGAP__px;
    margin: __RULEMARGIN__px 0;
  }
  .rule i { display: block; width: __RULEW__px; height: 2px;
            background: linear-gradient(90deg, rgba(212,165,18,0) 0%, var(--gold) 50%, rgba(212,165,18,0) 100%); }
  .rule b { display: block; width: __DOT__px; height: __DOT__px;
            background: var(--gold); transform: rotate(45deg); }
  .rule.closer { position: absolute; left: 0; right: 0; bottom: __PADBOT__px; margin: 0; }
  .rule.closer i { width: __CLOSERW__px; }

  .dates {
    font-family: "Avenir Next", sans-serif;
    font-weight: 500;
    font-size: __DATES__px;
    letter-spacing: __DATETRACK__px;
    color: rgba(255,255,255,0.94);
    text-shadow: 0 2px 14px rgba(0,0,0,0.55);
  }

  figure {
    margin-top: __FIGGAP__px;
    width: __FIGW__px;
    padding: __FRAME__px;
    background: rgba(255,255,255,0.96);
    border-radius: __RADIUS__px;
    box-shadow: 0 26px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(212,165,18,0.35);
  }
  figure img { display: block; width: 100%; height: auto;
               border-radius: __INNERRADIUS__px;
               filter: saturate(1.08) contrast(1.03); }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="wash"></div>

  <div class="stage">
    <div class="block">
      __EMBLEM_TAG__
      <div class="kicker">__KICKER_TEXT__</div>
      <div class="headline">__HEADLINE_TEXT__</div>
      <div class="rule"><i></i><b></b><i></i></div>
      <div class="dates">__DATES_TEXT__</div>
    </div>

    <figure><img src="__PHOTO__" alt=""></figure>

    <div class="rule closer"><i></i><b></b><i></i></div>
  </div>
</body>
</html>
