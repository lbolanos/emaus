default_agents = ["claude", "antigravity"]

[gitignore]
enabled = true

[skills]
enabled = true

[agents.claude]
enabled = true
output_path = "CLAUDE.md"

[agents.antigravity]
enabled = true

# --- MCP Servers ---
# NOTA: nunca pongas secretos literales en este archivo — se commitea.
# Si un MCP necesita API key, pásala por variable de entorno.

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.sqlite]
command = "uvx"
args = ["mcp-server-sqlite", "--db-path", "/home/lbolanos/emaus/apps/api/database.sqlite"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
